<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Các món ngon Hà Nội</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="trang-mon-ngon">
    <header>
      <h1 class="tieu-de-chinh">Các món ngon Hà Nội</h1>
    </header>

    <div class="bo-cuc">
      <aside class="cot-anh">
        <img
          src="images/Bat.gif"
          alt="Minh họa món ngon Hà Nội"
          class="anh-minh-hoa"
        />
      </aside>

      <section class="cot-bang" aria-label="Danh sách 8 món ngon Hà Nội">
        <table class="bang-mon-an">
          <thead>
            <tr>
              <th class="cot-stt">STT</th>
              <th class="cot-ten-mon">Tên món ăn</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="cot-stt">1</td>
              <td class="cot-ten-mon">Bánh cuốn Thanh Trì</td>
            </tr>
            <tr>
              <td class="cot-stt">2</td>
              <td class="cot-ten-mon">Xôi Hà Nội</td>
            </tr>
            <tr>
              <td class="cot-stt">3</td>
              <td class="cot-ten-mon">Chả cá Lã Vọng</td>
            </tr>
            <tr>
              <td class="cot-stt">4</td>
              <td class="cot-ten-mon">Cháo Cóc</td>
            </tr>
            <tr>
              <td class="cot-stt">5</td>
              <td class="cot-ten-mon">Bánh Gai Ninh Giang</td>
            </tr>
            <tr>
              <td class="cot-stt">6</td>
              <td class="cot-ten-mon">Bún Thang Hà Nội</td>
            </tr>
            <tr>
              <td class="cot-stt">7</td>
              <td class="cot-ten-mon">Canh Lằng</td>
            </tr>
            <tr>
              <td class="cot-stt">8</td>
              <td class="cot-ten-mon">Vịt quay Lạng Sơn</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</body>
</html>
